[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agenda-citas"
version = "0.1.0"
description = "Agenda de citas para un centro de atención (IEI-050): FastAPI + NiceGUI + PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Nicolás Andrés Cano Leal" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "nicegui>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # herramientas de documentación: diagramas (pillow) e informe PDF (pymupdf + mistune)
    "pillow>=10",
    "pymupdf>=1.24",
    "mistune>=3",
]

[tool.setuptools.packages.find]
include = ["agenda_citas*", "frontend*"]

[tool.ruff]
line-length = 100
target-version = "py313"
# md-a-pdf.py es un script de documentación copiado tal cual; no se reformatea.
extend-exclude = ["docs/md-a-pdf.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# N818: los nombres de error están en español (ErrorApi, ApiNoDisponible), sin sufijo Error.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Los diagramas usan notación de geometría (W, H, X, L = lienzo) por claridad.
"docs/generar_diagramas.py" = ["N803", "N806"]

[tool.pytest.ini_options]
# pythonpath = ["."]: el mismo import que en el CI, sin depender de `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integracion: requiere PostgreSQL real (variable DATABASE_URL); se salta si no está",
]

[tool.coverage.run]
source = ["agenda_citas", "frontend"]
# Las páginas NiceGUI y el arranque de uvicorn se verifican con el navegador (ver evidencias/),
# no con pruebas unitarias.
omit = ["frontend/app.py", "frontend/paginas.py", "agenda_citas/__main__.py"]

[tool.coverage.report]
show_missing = true
